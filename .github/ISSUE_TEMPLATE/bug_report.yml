name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Plugin 1.0.0 · WordPress 6.8 · PHP 8.3 · Theme/Builder
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or error logs
